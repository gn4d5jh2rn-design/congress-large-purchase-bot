name: Test QuantEngines

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test QuantEngines API
        run: |
          python - <<'PY'
          import requests

          url = "https://quantengines.com/api/v1/trades/recent/list"
          r = requests.get(url, params={"limit": 5}, timeout=30)

          print("Status:", r.status_code)
          print(r.text[:1000])

          r.raise_for_status()
          PY
