name: Test Tracefour

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test Tracefour API
        run: |
          python - <<'PY'
          import requests

          url = "https://tracefour.com/v1/congress"
          r = requests.get(url, timeout=30)

          print("Status:", r.status_code)
          print(r.text[:500])

          r.raise_for_status()
          PY
