name: Test CongressInvests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test CongressInvests API
        run: |
          python - <<'PY'
          import requests

          url = "https://congressinfor-production.up.railway.app/trades/recent"

          r = requests.get(
              url,
              params={"days": 7},
              timeout=30,
          )

          print("Status:", r.status_code)
          print(r.text[:2000])

          r.raise_for_status()
          PY
