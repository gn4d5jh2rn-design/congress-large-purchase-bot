name: Test InsiderWatch

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test InsiderWatch CSV
        run: |
          python - <<'PY'
          import requests

          url = "https://insiderwatch.ai/api/data/congress-trades.csv"

          r = requests.get(url, timeout=30)

          print("Status:", r.status_code)
          print("Content-Type:", r.headers.get("content-type"))
          print(r.text[:1000])

          r.raise_for_status()
          PY
